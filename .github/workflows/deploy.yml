name: Deploy to GitHub Pages

# Dispara só em push pra master — é a branch de "o que está pronto" deste
# projeto (ver README, seção Branches). dev não publica sozinha; o merge
# pra master é o gatilho de deploy.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita dois deploys correndo ao mesmo tempo por dois pushes seguidos — o
# segundo cancela o primeiro em vez de os dois brigarem pelo mesmo ambiente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
